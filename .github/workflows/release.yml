# 手动发布: 构建 split-per-abi release, 校验签名/版本/校验和, 创建 draft release。
#
# 需要仓库 Secrets:
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS
#   RELEASE_CERT_SHA256 (可选; 设置后强制比对证书指纹)
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 1.2.0; 留空则读取 pubspec.yaml)"
        required: false
        type: string
      draft:
        description: "创建为 draft release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/release.jks
          EOF
          chmod 600 android/key.properties android/release.jks

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PUB_VERSION=$(sed -n 's/^version: \([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml)
          VERSION="${INPUT_VERSION:-$PUB_VERSION}"
          if [ "$VERSION" != "$PUB_VERSION" ]; then
            echo "::error::Input version $VERSION does not match pubspec $PUB_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze --fatal-warnings
      - run: dart run tool/verify.dart
      - name: Build release APKs
        run: >-
          flutter build apk --release --split-per-abi
          -PrequireReleaseKey=true

      - name: Verify signature, version and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_CERT: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          test -x "$APKSIGNER"
          test -x "$AAPT2"

          APKS=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [ "${#APKS[@]}" -ne 3 ]; then
            echo "::error::Expected 3 split APKs, found ${#APKS[@]}"
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            "$APKSIGNER" verify --print-certs "$apk"
            if [ -n "${EXPECTED_CERT:-}" ]; then
              ACTUAL=$( "$APKSIGNER" verify --print-certs "$apk" \
                | sed -n 's/.*SHA-256 digest: //p' | head -1 \
                | tr '[:upper:]' '[:lower:]' | tr -d ':' )
              WANT=$(printf '%s' "$EXPECTED_CERT" \
                | tr '[:upper:]' '[:lower:]' | tr -d ':')
              if [ "$ACTUAL" != "$WANT" ]; then
                echo "::error::Certificate mismatch for $apk"
                exit 1
              fi
            fi
            BADGING=$( "$AAPT2" dump badging "$apk" | head -1 )
            echo "$BADGING"
            if ! printf '%s' "$BADGING" | grep -q "versionName='$VERSION'"; then
              echo "::error::Version mismatch for $apk (expected $VERSION)"
              exit 1
            fi
          done

          sha256sum "${APKS[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release notes
        run: |
          set -euo pipefail
          {
            echo "漢字仮名 v${{ steps.version.outputs.version }}"
            echo
            echo "APK 校验和:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "校验方式: sha256sum -c SHA256SUMS.txt"
          } > release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanji-hiragana-${{ steps.version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            SHA256SUMS.txt
            release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          DRAFT_FLAG=""
          if [ "$DRAFT" = "true" ]; then DRAFT_FLAG="--draft"; fi
          gh release create "$TAG" \
            --title "漢字仮名 $TAG" \
            --notes-file release-notes.md \
            $DRAFT_FLAG \
            build/app/outputs/flutter-apk/app-*-release.apk \
            SHA256SUMS.txt
