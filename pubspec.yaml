name: kanji_hiragana
description: "输入日语汉字, 即时显示对应平假名与罗马音。"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 纯 Dart 形态素分析 (Atilika IPADIC 词典内置)
  kuromoji: ^1.0.5
  # 本地持久化设置 (主题模式 / 旋转开关)
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
